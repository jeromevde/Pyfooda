[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfooda"
dynamic = ["version"]
description = "Recipe ingredient nutrition database from Epicure vocabulary and USDA FoodData Central"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jerome" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0.0",
]

[project.optional-dependencies]
build = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "tqdm>=4.0.0",
]

[project.scripts]
pyfooda-build = "pyfooda.build.build_database:main"
pyfooda-recompute = "pyfooda.build.recompute:main"
pyfooda-export-web = "pyfooda.build.export_web:main"
pyfooda-download-usda = "pyfooda.build.download_usda:main"

[tool.setuptools.dynamic]
version = { file = "pyfooda/VERSION" }

[tool.setuptools.packages.find]
include = ["pyfooda*"]
