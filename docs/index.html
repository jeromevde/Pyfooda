<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyfooda — Food Nutrition Lookup</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #fafafa; --surface: #fff; --border: #e0e0e0;
    --text: #1a1a1a; --muted: #666; --accent: #2563eb;
    --accent-light: #dbeafe; --radius: 8px;
    --green: #16a34a; --yellow: #ca8a04; --red: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --surface: #1a1a1a; --border: #333;
      --text: #e5e5e5; --muted: #999; --accent: #60a5fa;
      --accent-light: #1e3a5f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }

  /* Header */
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: .3rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: .95rem; }

  /* Search */
  .search-wrap {
    position: relative; margin-bottom: 1rem;
  }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--muted); pointer-events: none;
  }
  #search {
    width: 100%; padding: 12px 14px 12px 42px;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 1rem; background: var(--surface); color: var(--text);
    outline: none; transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  /* Results list */
  #results {
    list-style: none; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface);
    max-height: 320px; overflow-y: auto; display: none;
  }
  #results.visible { display: block; }
  #results li {
    padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  #results li:last-child { border-bottom: none; }
  #results li:hover, #results li.active { background: var(--accent-light); }
  #results li .cat {
    font-size: .8rem; color: var(--muted); margin-left: .5rem;
  }

  /* Detail panel */
  #detail { display: none; margin-top: 1.5rem; }
  #detail.visible { display: block; }
  .food-header {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: .5rem; margin-bottom: 1.2rem;
  }
  .food-header h2 { font-size: 1.4rem; font-weight: 600; }
  .food-header .badge {
    font-size: .8rem; padding: 3px 10px; border-radius: 20px;
    background: var(--accent-light); color: var(--accent); font-weight: 500;
  }

  /* Nutrient groups */
  .nutrient-group { margin-bottom: 1.5rem; }
  .nutrient-group h3 {
    font-size: .85rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: .6rem;
    padding-bottom: .3rem; border-bottom: 1px solid var(--border);
  }
  .nutrient-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 8px; align-items: center; padding: 5px 0;
  }
  .nutrient-row .name { font-size: .9rem; }
  .nutrient-row .value {
    font-size: .85rem; font-weight: 600;
    text-align: right; white-space: nowrap; min-width: 70px;
  }
  .bar-wrap {
    height: 8px; background: var(--border); border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 4px;
    transition: width .3s ease;
  }

  /* Loading */
  .loading {
    text-align: center; padding: 3rem; color: var(--muted);
  }
  .loading .spinner {
    display: inline-block; width: 28px; height: 28px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite;
    margin-bottom: .5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center; margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border); color: var(--muted); font-size: .82rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍎 <span>Pyfooda</span></h1>
    <p>Search 30k+ everyday foods — nutrition data from USDA FoodData Central</p>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Loading food database…</div>
  </div>

  <div id="app" style="display:none">
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-5.2-5.2m0 0A7.5 7.5 0 105.8 15.8a7.5 7.5 0 0010 0z"/>
      </svg>
      <input id="search" type="text" placeholder="Search foods… e.g. cheddar, banana, chicken breast"
             autocomplete="off" spellcheck="false">
    </div>
    <ul id="results"></ul>
    <div id="detail"></div>
  </div>

  <footer>
    Data: <a href="https://fdc.nal.usda.gov/">USDA FoodData Central</a> ·
    Package: <a href="https://pypi.org/project/pyfooda/">pip install pyfooda</a> ·
    Source: <a href="https://github.com/jeromevde/Pyfooda">GitHub</a>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------ */
/*  Data loading                                                       */
/* ------------------------------------------------------------------ */
let foods = [];       // [{foodName, category, nutrients: {name: val}}]
let nutrientMeta = []; // [{nutrientName, unit_name, nutrient_category, drv}]
let foodNames = [];
let foodNamesLower = [];
let idf = {};         // token -> IDF score (for BM25-lite search)

const dataBase = window.location.hostname.includes('github.io')
  ? './data/' : './data/';

function loadCSV(url) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true, header: true, skipEmptyLines: true,
      complete: r => resolve(r.data),
      error: e => reject(e),
    });
  });
}

async function init() {
  try {
    const [foodRows, nutrientRows] = await Promise.all([
      loadCSV(dataBase + 'foods_aggregated.csv'),
      loadCSV(dataBase + 'nutrients.csv'),
    ]);

    // Parse nutrient metadata — deduplicate by nutrientName, keeping first
    const seen = new Set();
    nutrientMeta = [];
    for (const r of nutrientRows) {
      const name = r.nutrientName;
      if (!name || seen.has(name)) continue;
      seen.add(name);
      nutrientMeta.push({
        nutrientName: name,
        unit_name: r.unit_name || '',
        nutrient_category: r.nutrient_category || 'Other',
        drv: parseFloat(r.drv) || 0,
        order: parseInt(r.nutrient_order) || 99,
      });
    }
    nutrientMeta.sort((a, b) => a.order - b.order);

    // Build the set of nutrient columns present in the food CSV
    const foodCols = new Set(Object.keys(foodRows[0] || {}));
    const availableNutrients = nutrientMeta.filter(n => foodCols.has(n.nutrientName));

    // Parse foods
    foods = foodRows.map(r => {
      const nutrients = {};
      for (const nm of availableNutrients) {
        const v = parseFloat(r[nm.nutrientName]);
        if (!isNaN(v)) nutrients[nm.nutrientName] = v;
      }
      return { foodName: r.foodName || '', category: r.category || '', nutrients };
    }).filter(f => f.foodName);

    foodNames = foods.map(f => f.foodName);
    foodNamesLower = foodNames.map(n => n.toLowerCase());

    // Pre-compute IDF for BM25-lite
    buildIDF();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('search').focus();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      '<p style="color:var(--red)">Failed to load data. ' + e + '</p>';
  }
}

/* ------------------------------------------------------------------ */
/*  BM25-lite search                                                   */
/* ------------------------------------------------------------------ */
let docTokens = [];   // per-food token arrays
let docLens = [];
let avgDL = 0;

function buildIDF() {
  const N = foodNamesLower.length;
  const df = {};  // document frequency
  docTokens = [];
  docLens = [];
  let totalLen = 0;

  for (const nl of foodNamesLower) {
    const tokens = nl.split(/\s+/);
    docTokens.push(tokens);
    docLens.push(tokens.length);
    totalLen += tokens.length;
    const unique = new Set(tokens);
    for (const t of unique) df[t] = (df[t] || 0) + 1;
  }
  avgDL = totalLen / N;

  // IDF: log((N - df + 0.5) / (df + 0.5) + 1)
  idf = {};
  for (const [t, freq] of Object.entries(df)) {
    idf[t] = Math.log((N - freq + 0.5) / (freq + 0.5) + 1);
  }
}

function search(query, n = 15) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const qTokens = q.split(/\s+/);

  // BM25 parameters
  const k1 = 1.5, b = 0.75;
  const candidates = [];

  for (let i = 0; i < foods.length; i++) {
    const tokens = docTokens[i];
    const dl = docLens[i];

    // BM25 score
    let score = 0;
    for (const qt of qTokens) {
      const tf = tokens.filter(t => t === qt).length;
      if (tf === 0) continue;
      const idfVal = idf[qt] || 0;
      score += idfVal * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / avgDL));
    }
    if (score <= 0) continue;

    // Bonuses
    const nl = foodNamesLower[i];
    if (nl === q) score += 100;
    else if (nl.startsWith(q + ' ') || nl.startsWith(q)) score += 20;
    else if (qTokens.every(t => nl.includes(t))) score += 10;

    // Brevity bonus
    score += 8 / (1 + tokens.length);

    candidates.push({ idx: i, score });
  }

  candidates.sort((a, b) => b.score - a.score);
  return candidates.slice(0, n);
}

/* ------------------------------------------------------------------ */
/*  UI                                                                 */
/* ------------------------------------------------------------------ */
const searchInput = document.getElementById('search');
const resultsList = document.getElementById('results');
const detailPanel = document.getElementById('detail');
let activeIdx = -1;
let currentResults = [];
let debounceTimer;

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(doSearch, 80);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (activeIdx < currentResults.length - 1) setActive(activeIdx + 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (activeIdx > 0) setActive(activeIdx - 1);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIdx >= 0 && currentResults[activeIdx] != null)
      selectFood(currentResults[activeIdx].idx);
  } else if (e.key === 'Escape') {
    resultsList.classList.remove('visible');
  }
});

function doSearch() {
  const q = searchInput.value.trim();
  if (!q) {
    resultsList.classList.remove('visible');
    currentResults = [];
    activeIdx = -1;
    return;
  }
  currentResults = search(q);
  activeIdx = currentResults.length > 0 ? 0 : -1;
  renderResults();
}

function renderResults() {
  resultsList.innerHTML = '';
  if (!currentResults.length) {
    resultsList.classList.remove('visible');
    return;
  }
  for (let i = 0; i < currentResults.length; i++) {
    const f = foods[currentResults[i].idx];
    const li = document.createElement('li');
    li.innerHTML = `${esc(f.foodName)}<span class="cat">${esc(f.category)}</span>`;
    if (i === activeIdx) li.classList.add('active');
    li.addEventListener('click', () => selectFood(currentResults[i].idx));
    li.addEventListener('mouseenter', () => setActive(i));
    resultsList.appendChild(li);
  }
  resultsList.classList.add('visible');
}

function setActive(i) {
  activeIdx = i;
  const items = resultsList.querySelectorAll('li');
  items.forEach((li, j) => li.classList.toggle('active', j === i));
  if (items[i]) items[i].scrollIntoView({ block: 'nearest' });
}

function selectFood(idx) {
  const f = foods[idx];
  searchInput.value = f.foodName;
  resultsList.classList.remove('visible');
  renderDetail(f);
}

/* ------------------------------------------------------------------ */
/*  Nutrient detail rendering                                          */
/* ------------------------------------------------------------------ */

function renderDetail(food) {
  // Group available nutrients by category
  const groups = {};
  for (const nm of nutrientMeta) {
    if (!(nm.nutrientName in food.nutrients)) continue;
    const cat = nm.nutrient_category;
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(nm);
  }

  let html = `<div class="food-header">
    <h2>${esc(food.foodName)}</h2>
    <span class="badge">${esc(food.category)}</span>
  </div>`;

  const categoryOrder = ['Energy', 'Carbohydrates', 'Lipids', 'Proteins', 'Vitamins', 'Minerals'];
  const orderedCats = categoryOrder.filter(c => groups[c]);
  // Add any remaining
  for (const c of Object.keys(groups)) {
    if (!orderedCats.includes(c)) orderedCats.push(c);
  }

  for (const cat of orderedCats) {
    const nutrients = groups[cat];
    html += `<div class="nutrient-group"><h3>${esc(cat)}</h3>`;
    for (const nm of nutrients) {
      const val = food.nutrients[nm.nutrientName];
      const unit = nm.unit_name;
      const drv = nm.drv;
      let pct = drv > 0 ? Math.min((val / drv) * 100, 100) : 0;
      let barColor = pct < 15 ? 'var(--muted)' : pct < 50 ? 'var(--green)' : pct < 80 ? 'var(--yellow)' : 'var(--red)';
      let pctLabel = drv > 0 ? ` (${Math.round((val / drv) * 100)}% DV)` : '';

      html += `<div class="nutrient-row">
        <span class="name">${esc(nm.nutrientName)}</span>
        <span class="value">${formatVal(val)} ${esc(unit)}${pctLabel}</span>
        <div class="bar-wrap"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${barColor}"></div></div>
      </div>`;
    }
    html += '</div>';
  }

  detailPanel.innerHTML = html;
  detailPanel.classList.add('visible');
}

function formatVal(v) {
  if (v == null || isNaN(v)) return '—';
  if (v >= 100) return Math.round(v).toLocaleString();
  if (v >= 1) return v.toFixed(1);
  return v.toFixed(2);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Boot
init();
</script>
</body>
</html>
