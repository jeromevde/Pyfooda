<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyfooda — Food Nutrition Lookup</title>
<style>
  :root {
    --bg: #fafafa; --surface: #fff; --border: #e0e0e0;
    --text: #1a1a1a; --muted: #666; --accent: #2563eb;
    --accent-light: #dbeafe; --radius: 8px;
    --green: #16a34a; --yellow: #ca8a04; --red: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --surface: #1a1a1a; --border: #333;
      --text: #e5e5e5; --muted: #999; --accent: #60a5fa;
      --accent-light: #1e3a5f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }

  /* Header */
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: .3rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: .95rem; }
  header .db-count {
    display: inline-block; margin-top: .35rem;
    font-size: .82rem; color: var(--accent); font-weight: 600;
  }

  /* Search */
  .search-wrap {
    position: relative; margin-bottom: 1rem;
  }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--muted); pointer-events: none;
  }
  #search {
    width: 100%; padding: 12px 14px 12px 42px;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 1rem; background: var(--surface); color: var(--text);
    outline: none; transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  /* Catalog layout */
  .app-layout {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: 1.25rem;
    align-items: start;
  }
  @media (max-width: 820px) {
    .app-layout { grid-template-columns: 1fr; }
  }

  .catalog {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 220px);
    min-height: 420px;
    position: sticky;
    top: 1rem;
  }
  @media (max-width: 820px) {
    .catalog {
      position: static;
      max-height: 360px;
      min-height: 280px;
    }
  }
  .catalog-header {
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: .78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    background: color-mix(in srgb, var(--surface) 92%, var(--border));
  }
  .catalog-list {
    overflow-y: auto;
    flex: 1;
    padding: .35rem;
  }
  .catalog-item {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: .65rem .75rem;
    cursor: pointer;
    transition: background .12s, box-shadow .12s;
    margin-bottom: 2px;
  }
  .catalog-item:hover { background: var(--accent-light); }
  .catalog-item.active {
    background: var(--accent-light);
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .catalog-item .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .5rem;
  }
  .catalog-item .name {
    font-size: .92rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .catalog-item .energy {
    font-size: .78rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }
  .catalog-item .row-bottom {
    display: flex;
    justify-content: space-between;
    gap: .5rem;
    margin-top: .2rem;
  }
  .catalog-item .id {
    font-size: .72rem;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .catalog-item .meta {
    font-size: .7rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .catalog-empty {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--muted);
    font-size: .88rem;
  }

  /* Detail panel */
  #detail {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 1.25rem;
    min-height: 420px;
  }
  #detail.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: .95rem;
  }
  #detail:not(.empty) { display: block; }
  .food-header {
    margin-bottom: 1.2rem;
  }
  .food-header-top {
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: .5rem;
  }
  .food-header h2 { font-size: 1.4rem; font-weight: 600; }
  .food-header .badge {
    font-size: .8rem; padding: 3px 10px; border-radius: 20px;
    background: var(--accent-light); color: var(--accent); font-weight: 500;
  }
  .food-meta {
    display: flex; gap: 1rem; flex-wrap: wrap;
    margin-top: .4rem; font-size: .85rem; color: var(--muted);
  }

  /* Nutrient groups */
  .nutrient-group { margin-bottom: 1.5rem; }
  .nutrient-group h3 {
    font-size: .85rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: .6rem;
    padding-bottom: .3rem; border-bottom: 1px solid var(--border);
  }
  .nutrient-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 8px; align-items: center; padding: 5px 0;
    cursor: pointer; border-radius: 6px; transition: background .12s;
  }
  .nutrient-row:hover { background: color-mix(in srgb, var(--accent-light) 65%, transparent); }
  .nutrient-row .name-wrap { display: flex; flex-direction: column; gap: 2px; }
  .nutrient-row .name { font-size: .9rem; }
  .nutrient-row .detail-line {
    font-size: .72rem; color: var(--muted); line-height: 1.3;
  }
  .bar-wrap { position: relative; }
  .bar-ci {
    position: absolute; top: -2px; height: 12px;
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    border-radius: 4px; pointer-events: none;
  }

  /* Modals */
  .modal-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    z-index: 9999;
    background: rgba(0, 0, 0, .45);
    padding: 1rem;
    overflow-y: auto;
    box-sizing: border-box;
  }
  .modal-backdrop.visible {
    display: grid;
    place-items: center;
  }
  .modal {
    width: min(640px, 100%);
    max-height: min(80vh, calc(100dvh - 2rem));
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
    margin: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 1rem; padding: 1rem 1.1rem .75rem; border-bottom: 1px solid var(--border);
  }
  .modal-header h3 { font-size: 1.05rem; font-weight: 600; }
  .modal-header p { font-size: .82rem; color: var(--muted); margin-top: .2rem; }
  .modal-close {
    border: none; background: none; color: var(--muted); font-size: 1.4rem;
    line-height: 1; cursor: pointer; padding: .1rem .35rem;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { overflow-y: auto; padding: .5rem 0; }
  .source-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  .source-table th, .source-table td {
    padding: .55rem 1rem; text-align: left; border-bottom: 1px solid var(--border);
  }
  .source-table th {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); position: sticky; top: 0; background: var(--surface);
  }
  .source-table tr:last-child td { border-bottom: none; }
  .source-table tr.missing td { opacity: .55; font-style: italic; }
  .source-table tr.aggregate td {
    background: color-mix(in srgb, var(--accent-light) 55%, transparent);
    font-weight: 600;
  }
  .click-hint {
    font-size: .8rem; color: var(--muted); margin-top: .25rem;
  }
  .nutrient-row .value {
    font-size: .85rem; font-weight: 600;
    text-align: right; white-space: nowrap; min-width: 70px;
  }
  .bar-wrap {
    height: 8px; background: var(--border); border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 4px;
    transition: width .3s ease;
  }

  /* Loading */
  .loading {
    text-align: center; padding: 3rem; color: var(--muted);
  }
  .loading .spinner {
    display: inline-block; width: 28px; height: 28px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite;
    margin-bottom: .5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center; margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border); color: var(--muted); font-size: .82rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  .coverage-link {
    display: inline-block; margin-top: .5rem; margin-left: .75rem;
    font-size: .82rem; color: var(--accent); font-weight: 600;
    background: none; border: none; cursor: pointer; padding: 0;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .coverage-link:hover { opacity: .85; }

  .food-coverage {
    font-size: .82rem; color: var(--muted); margin-top: .35rem;
  }
  .missing-nutrients {
    margin-top: 1rem; padding: .75rem 1rem;
    border: 1px dashed var(--border); border-radius: 8px;
    font-size: .78rem; color: var(--muted); line-height: 1.45;
  }
  .missing-nutrients strong { color: var(--text); font-weight: 600; }

  .coverage-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .coverage-table th, .coverage-table td {
    padding: .45rem .6rem; text-align: left; border-bottom: 1px solid var(--border);
  }
  .coverage-table th { font-weight: 600; color: var(--muted); font-size: .72rem; text-transform: uppercase; }
  .coverage-bar {
    height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 70%, transparent);
    min-width: 2px;
  }
  .coverage-pct { font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>

<div class="modal-backdrop" id="coverage-modal" onclick="if(event.target===this) closeCoverageModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="coverage-title">
    <div class="modal-header">
      <div>
        <h3 id="coverage-title">Nutrient coverage</h3>
        <p id="coverage-subtitle"></p>
      </div>
      <button class="modal-close" type="button" onclick="closeCoverageModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="coverage-body"></div>
  </div>
</div>

<div class="modal-backdrop" id="nutrient-modal" onclick="if(event.target===this) closeNutrientModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div>
        <h3 id="modal-title"></h3>
        <p id="modal-subtitle"></p>
      </div>
      <button class="modal-close" type="button" onclick="closeNutrientModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="container">
  <header>
    <h1>🍎 <span>Pyfooda</span></h1>
    <p>Recipe ingredient nutrition per 100g — Epicure vocabulary + USDA FoodData Central</p>
    <div class="db-count" id="db-count"></div>
    <button type="button" class="coverage-link" id="coverage-btn" style="display:none" onclick="openCoverageModal()">Nutrient coverage report</button>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Loading food database…</div>
  </div>

  <div id="app" style="display:none">
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-5.2-5.2m0 0A7.5 7.5 0 105.8 15.8a7.5 7.5 0 0010 0z"/>
      </svg>
      <input id="search" type="text" placeholder="Filter ingredients… e.g. cheddar, hazelnut, rice"
             autocomplete="off" spellcheck="false">
    </div>

    <div class="app-layout">
      <aside class="catalog">
        <div class="catalog-header" id="catalog-count">Ingredients</div>
        <div id="catalog-list" class="catalog-list"></div>
      </aside>
      <div id="detail" class="empty">Select an ingredient to view nutrients</div>
    </div>
  </div>

  <footer>
    Data: <a href="https://fdc.nal.usda.gov/">USDA FoodData Central</a> ·
    Vocabulary: <a href="https://huggingface.co/datasets/Kaikaku/epicure-corpus-resources">Epicure</a> ·
    Package: <a href="https://pypi.org/project/pyfooda/">pip install pyfooda</a> ·
    Source: <a href="https://github.com/jeromevde/Pyfooda">GitHub</a>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------ */
/*  Nutrient metadata (embedded to avoid extra fetch)                  */
/* ------------------------------------------------------------------ */
const NUTRIENT_META = [
  { name: "Energy", unit: "KCAL", cat: "Energy", drv: 2500 },
  { name: "Carbohydrate", unit: "G", cat: "Carbohydrates", drv: 320 },
  { name: "Sugars, Total", unit: "G", cat: "Carbohydrates", drv: 50 },
  { name: "Fiber", unit: "G", cat: "Carbohydrates", drv: 30 },
  { name: "Total fat", unit: "G", cat: "Lipids", drv: 80 },
  { name: "Cholesterol", unit: "MG", cat: "Lipids", drv: 300 },
  { name: "Fatty acids, total saturated", unit: "G", cat: "Lipids", drv: 20 },
  { name: "Protein", unit: "G", cat: "Proteins", drv: 160 },
  { name: "Vitamin A, RAE", unit: "UG", cat: "Vitamins", drv: 900 },
  { name: "Vitamin E", unit: "MG", cat: "Vitamins", drv: 15 },
  { name: "Vitamin D (D2 + D3)", unit: "UG", cat: "Vitamins", drv: 20 },
  { name: "Vitamin C", unit: "MG", cat: "Vitamins", drv: 90 },
  { name: "Vitamin B-6", unit: "MG", cat: "Vitamins", drv: 1.7 },
  { name: "Folate, total", unit: "UG", cat: "Vitamins", drv: 400 },
  { name: "Vitamin B-12", unit: "UG", cat: "Vitamins", drv: 2.4 },
  { name: "Calcium", unit: "MG", cat: "Minerals", drv: 1000 },
  { name: "Iron", unit: "MG", cat: "Minerals", drv: 10 },
  { name: "Magnesium", unit: "MG", cat: "Minerals", drv: 420 },
  { name: "Phosphorus", unit: "MG", cat: "Minerals", drv: 700 },
  { name: "Potassium", unit: "MG", cat: "Minerals", drv: 3400 },
  { name: "Sodium", unit: "MG", cat: "Minerals", drv: 1500 },
  { name: "Zinc", unit: "MG", cat: "Minerals", drv: 11 },
];

/* ------------------------------------------------------------------ */
/*  Data loading                                                       */
/* ------------------------------------------------------------------ */
let foods = [];
let foodNames = [];
let foodNamesLower = [];
let sortedIndices = [];
let selectedIdx = -1;
let idf = {};

/* Source-name → food-index reverse map (for brand-name search) */
let sourceNameIndex = {};  // token -> Set of food indices
let sourceNameKeys = [];   // sorted keys for binary-search prefix lookup

const dataBase = './data/';
const DATA_VERSION = '0.2.9';

function setModalOpen(open) {
  document.body.style.overflow = open ? 'hidden' : '';
}

let dbMeta = {};
let dbCoverage = null;

async function init() {
  try {
    const resp = await fetch(dataBase + 'ingredients.json?v=' + DATA_VERSION);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    foods = Array.isArray(data) ? data : (data.foods || []);
    dbMeta = data.meta || {};
    dbCoverage = dbMeta.coverage || null;

    foodNames = foods.map(f => f.display_name);
    foodNamesLower = foodNames.map(n => n.toLowerCase());

    buildIndex();

    sortedIndices = foods.map((_, i) => i).sort((a, b) =>
      foodNames[a].localeCompare(foodNames[b], undefined, { sensitivity: 'base' })
    );

    const count = dbMeta.count || foods.length;
    const withData = foods.filter(f => (f.source_count || 0) > 0).length;
    document.getElementById('db-count').textContent =
      `${count.toLocaleString()} ingredients · ${withData.toLocaleString()} with USDA nutrient profiles`;
    if (dbCoverage) document.getElementById('coverage-btn').style.display = 'inline-block';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    renderCatalog();
    document.getElementById('search').focus();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      '<p style="color:var(--red)">Failed to load data. ' + e + '</p>';
  }
}

/* ------------------------------------------------------------------ */
/*  Search engine: BM25 + prefix matching + source-name lookup         */
/* ------------------------------------------------------------------ */
let docTokens = [];
let docLens = [];
let avgDL = 0;

function buildIndex() {
  const N = foodNamesLower.length;
  const df = {};
  docTokens = [];
  docLens = [];
  let totalLen = 0;

  for (const nl of foodNamesLower) {
    const tokens = nl.split(/\s+/);
    docTokens.push(tokens);
    docLens.push(tokens.length);
    totalLen += tokens.length;
    const unique = new Set(tokens);
    for (const t of unique) df[t] = (df[t] || 0) + 1;
  }
  avgDL = totalLen / N;

  idf = {};
  for (const [t, freq] of Object.entries(df)) {
    idf[t] = Math.log((N - freq + 0.5) / (freq + 0.5) + 1);
  }

  /* Build source-name reverse index: extract unique tokens from each
     food's source_names array, map token → set of food indices.
     This lets "nutella" find "Hazelnut Spread" because one of its
     sources was named "NUTELLA ...". */
  sourceNameIndex = {};
  for (let i = 0; i < foods.length; i++) {
    const sources = foods[i].sources || [];
    if (!sources.length) continue;
    const seen = new Set();
    for (const src of sources) {
      const sn = src.foodName || '';
      const tokens = sn.toLowerCase().split(/[\s,\-\/\(\)]+/).filter(t => t.length >= 3);
      for (const t of tokens) {
        if (seen.has(t)) continue;
        seen.add(t);
        if (!sourceNameIndex[t]) sourceNameIndex[t] = new Set();
        sourceNameIndex[t].add(i);
      }
    }
  }
  /* Sort keys for binary-search prefix lookup */
  sourceNameKeys = Object.keys(sourceNameIndex).sort();
}

function filterFoods(query) {
  const q = query.toLowerCase().trim();
  if (!q) return sortedIndices;

  const ranked = search(q, foods.length);
  if (ranked.length) return ranked.map(r => r.idx);

  /* Fallback: substring on name or id */
  const hits = [];
  for (const i of sortedIndices) {
    const name = foodNamesLower[i];
    const id = foods[i].ingredient_id || '';
    if (name.includes(q) || id.includes(q.replace(/\s+/g, '_'))) hits.push(i);
  }
  return hits;
}

function macroPreview(food) {
  const n = food.nutrients || {};
  const kcal = n.Energy;
  if (kcal != null) return Math.round(kcal) + ' kcal';
  if (n.Protein != null) return n.Protein.toFixed(1) + 'g protein';
  return '';
}

function search(query, n = 15) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const qTokens = q.split(/\s+/);
  const k1 = 1.5, b = 0.75;
  const scores = new Float32Array(foods.length);

  /* --- Pass 1: BM25 on generic names (exact token match) --- */
  for (let i = 0; i < foods.length; i++) {
    const tokens = docTokens[i];
    const dl = docLens[i];
    let score = 0;
    for (const qt of qTokens) {
      const tf = tokens.filter(t => t === qt).length;
      if (tf === 0) continue;
      const idfVal = idf[qt] || 0;
      score += idfVal * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / avgDL));
    }
    scores[i] = score;
  }

  /* --- Pass 2: Prefix matching on generic names --- */
  for (let i = 0; i < foods.length; i++) {
    const tokens = docTokens[i];
    let prefixHits = 0;
    for (const qt of qTokens) {
      if (qt.length < 2) continue;
      for (const t of tokens) {
        if (t.startsWith(qt) && t !== qt) {
          prefixHits++;
          break;
        }
      }
    }
    if (prefixHits > 0) {
      /* Give prefix matches a decent score, scaled by how many query
         tokens matched as prefix — but less than an exact BM25 hit */
      const boost = prefixHits * 3.0 * (qTokens.length > 0 ? prefixHits / qTokens.length : 1);
      scores[i] = Math.max(scores[i], boost);
    }
  }

  /* --- Pass 3: Source-name lookup (brand → generic) --- */
  for (const qt of qTokens) {
    if (qt.length < 3) continue;

    /* Exact token match in source names */
    const exact = sourceNameIndex[qt];
    if (exact) {
      for (const i of exact) {
        if (scores[i] < 1.5) scores[i] = Math.max(scores[i], 1.5);
      }
    }

    /* Prefix match via binary search on sorted keys */
    let lo = 0, hi = sourceNameKeys.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (sourceNameKeys[mid] < qt) lo = mid + 1; else hi = mid;
    }
    for (let k = lo; k < sourceNameKeys.length; k++) {
      const key = sourceNameKeys[k];
      if (!key.startsWith(qt)) break;
      if (key === qt) continue; /* already handled above */
      for (const i of sourceNameIndex[key]) {
        if (scores[i] < 0.8) scores[i] = Math.max(scores[i], 0.8);
      }
    }
  }

  /* --- Collect and rank --- */
  const candidates = [];
  for (let i = 0; i < foods.length; i++) {
    if (scores[i] <= 0) continue;

    let s = scores[i];
    const nl = foodNamesLower[i];
    /* Exact name match bonus */
    if (nl === q) s += 100;
    else if (nl.startsWith(q + ' ') || nl.startsWith(q)) s += 20;
    else if (qTokens.every(t => nl.includes(t))) s += 10;
    /* Prefer shorter, more generic names */
    s += 8 / (1 + docTokens[i].length);

    candidates.push({ idx: i, score: s });
  }

  candidates.sort((a, b) => b.score - a.score);
  return candidates.slice(0, n);
}

/* ------------------------------------------------------------------ */
/*  UI                                                                 */
/* ------------------------------------------------------------------ */
const searchInput = document.getElementById('search');
const catalogList = document.getElementById('catalog-list');
const catalogCount = document.getElementById('catalog-count');
const detailPanel = document.getElementById('detail');
let catalogIndices = [];
let activeIdx = -1;

searchInput.addEventListener('input', () => renderCatalog());

searchInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (activeIdx < catalogIndices.length - 1) setActive(activeIdx + 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (activeIdx > 0) setActive(activeIdx - 1);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIdx >= 0 && catalogIndices[activeIdx] != null)
      selectFood(catalogIndices[activeIdx]);
  }
});

function renderCatalog() {
  const q = searchInput.value.trim();
  catalogIndices = filterFoods(q);
  activeIdx = catalogIndices.length ? Math.min(activeIdx, catalogIndices.length - 1) : -1;
  if (activeIdx < 0 && catalogIndices.length) activeIdx = 0;

  const total = foods.length;
  const shown = catalogIndices.length;
  catalogCount.textContent = q
    ? `${shown.toLocaleString()} of ${total.toLocaleString()} ingredients`
    : `${total.toLocaleString()} ingredients`;

  if (!shown) {
    catalogList.innerHTML = '<div class="catalog-empty">No ingredients match your filter</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  for (let i = 0; i < catalogIndices.length; i++) {
    const idx = catalogIndices[i];
    const f = foods[idx];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'catalog-item' + (idx === selectedIdx ? ' active' : '') + (i === activeIdx ? ' active' : '');
    const preview = macroPreview(f);
    const sim = f.top_similarity != null ? Math.round(f.top_similarity * 100) + '%' : '—';
    btn.innerHTML = `
      <div class="row-top">
        <span class="name">${esc(f.display_name)}</span>
        ${preview ? `<span class="energy">${esc(preview)}</span>` : ''}
      </div>
      <div class="row-bottom">
        <span class="id">${esc(f.ingredient_id)}</span>
        <span class="meta">${f.source_count || 0} src · ${sim}</span>
      </div>`;
    btn.addEventListener('click', () => selectFood(idx));
    btn.addEventListener('mouseenter', () => setActive(i));
    frag.appendChild(btn);
  }
  catalogList.innerHTML = '';
  catalogList.appendChild(frag);
}

function setActive(i) {
  activeIdx = i;
  const items = catalogList.querySelectorAll('.catalog-item');
  items.forEach((el, j) => el.classList.toggle('active', j === i));
  if (items[i]) items[i].scrollIntoView({ block: 'nearest' });
}

function selectFood(idx) {
  selectedIdx = idx;
  const f = foods[idx];
  renderCatalog();
  renderDetail(f);
  if (window.innerWidth <= 820) {
    detailPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* ------------------------------------------------------------------ */
/*  Nutrient detail rendering                                          */
/* ------------------------------------------------------------------ */
let currentFood = null;
let detailNutrients = [];

function nutrientMetaByName(name) {
  return NUTRIENT_META.find(n => n.name === name) || { name, unit: '', cat: '' };
}

function sourceNutrientValue(src, nutrientName) {
  const nutrients = src && src.nutrients;
  if (!nutrients || typeof nutrients !== 'object') return null;
  const val = nutrients[nutrientName];
  if (val == null || val === '') return null;
  const num = Number(val);
  return Number.isFinite(num) ? num : null;
}

function nutrientDetailLine(stat, sourceCount, unit, val) {
  const parts = [];
  if (stat && stat.ci_low != null && stat.ci_high != null && val != null) {
    parts.push(`95% CI: ${formatVal(stat.ci_low)}–${formatVal(stat.ci_high)} ${unit}`);
  }
  if (stat && stat.support) {
    parts.push(`${stat.support}/${sourceCount} sources`);
  }
  return parts.join(' · ');
}

function ciBarPct(stat, val, drv) {
  if (!stat || val == null || drv <= 0 || stat.ci_low == null || stat.ci_high == null) {
    return { left: 0, width: 0 };
  }
  const lo = Math.max(0, stat.ci_low);
  const hi = Math.max(lo, stat.ci_high);
  const left = Math.min((lo / drv) * 100, 100);
  const right = Math.min((hi / drv) * 100, 100);
  return { left, width: Math.max(right - left, 0) };
}

function renderNutrientRow(nm, nutrients, nutrientStats, sourceCount, scale) {
  const rawVal = nutrients[nm.name];
  const val = rawVal != null ? rawVal * scale : null;
  const stat = nutrientStats[nm.name];
  const drv = nm.drv;
  const pct = (drv > 0 && val != null) ? Math.min((val / drv) * 100, 100) : 0;
  const barColor = pct < 15 ? 'var(--muted)' : pct < 50 ? 'var(--green)' : pct < 80 ? 'var(--yellow)' : 'var(--red)';
  const pctLabel = (drv > 0 && val != null) ? ` (${Math.round((val / drv) * 100)}% DV)` : '';
  const detailLine = nutrientDetailLine(stat, sourceCount, nm.unit, val);
  const ciBar = ciBarPct(stat, val, drv);
  const nutrientIdx = detailNutrients.length;
  detailNutrients.push(nm.name);

  return `<div class="nutrient-row" data-nutrient-idx="${nutrientIdx}" title="View USDA sources">
    <div class="name-wrap">
      <span class="name">${esc(nm.name)}</span>
      ${detailLine ? `<span class="detail-line">${esc(detailLine)}</span>` : ''}
    </div>
    <span class="value">${formatVal(val)} ${esc(nm.unit)}${pctLabel}</span>
    <div class="bar-wrap">
      ${ciBar.width > 0 ? `<div class="bar-ci" style="left:${ciBar.left.toFixed(1)}%;width:${ciBar.width.toFixed(1)}%"></div>` : ''}
      <div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${barColor}"></div>
    </div>
  </div>`;
}

function ingredientMeasuredCount(food) {
  const stats = food.nutrient_stats || {};
  let measured = 0;
  for (const nm of NUTRIENT_META) {
    const st = stats[nm.name];
    if (st && st.support > 0) measured++;
    else if (food.nutrients && food.nutrients[nm.name] != null) measured++;
  }
  return measured;
}

function ingredientMissingNutrients(food) {
  const stats = food.nutrient_stats || {};
  return NUTRIENT_META
    .filter(nm => {
      const st = stats[nm.name];
      const hasValue = food.nutrients && food.nutrients[nm.name] != null;
      return !(st && st.support > 0) && !hasValue;
    })
    .map(nm => nm.name);
}

function renderDetail(food) {
  currentFood = food;
  detailNutrients = [];
  const scale = 1;
  const nutrients = food.nutrients;
  const nutrientStats = food.nutrient_stats || {};
  const sourceCount = food.source_count || 0;
  const measuredCount = ingredientMeasuredCount(food);
  const missing = ingredientMissingNutrients(food);

  const groups = {};
  for (const nm of NUTRIENT_META) {
    const stat = nutrientStats[nm.name];
    const rawVal = nutrients[nm.name];
    if (rawVal == null && (!stat || !stat.support)) continue;
    if (!groups[nm.cat]) groups[nm.cat] = [];
    groups[nm.cat].push(nm);
  }

  let html = `<div class="food-header">
    <div class="food-header-top">
      <h2>${esc(food.display_name)}</h2>
      <span class="badge">${esc(food.ingredient_id)}</span>
    </div>
    <div class="food-meta">
      <span>Averaged from <strong>${food.source_count}</strong> USDA match${food.source_count === 1 ? '' : 'es'}</span>
      ${food.top_similarity != null ? `<span>Top match: <strong>${(food.top_similarity * 100).toFixed(0)}%</strong></span>` : ''}
    </div>
    <div class="food-coverage">${measuredCount} of ${NUTRIENT_META.length} tracked nutrients measured from USDA sources</div>
    <div class="click-hint">Click any nutrient to see USDA source values</div>
  </div>`;

  // Nutrient groups
  const categoryOrder = ['Energy', 'Carbohydrates', 'Lipids', 'Proteins', 'Vitamins', 'Minerals'];
  const orderedCats = categoryOrder.filter(c => groups[c]);
  for (const c of Object.keys(groups)) {
    if (!orderedCats.includes(c)) orderedCats.push(c);
  }

  for (const cat of orderedCats) {
    html += `<div class="nutrient-group"><h3>${esc(cat)}</h3>`;
    for (const nm of groups[cat]) {
      html += renderNutrientRow(nm, nutrients, nutrientStats, sourceCount, scale);
    }
    html += '</div>';
  }

  if (missing.length) {
    html += `<div class="missing-nutrients"><strong>Not measured:</strong> ${esc(missing.join(', '))}</div>`;
  }

  detailPanel.innerHTML = html;
  detailPanel.classList.remove('empty');
  detailPanel.onclick = (e) => {
    const row = e.target.closest('[data-nutrient-idx]');
    if (!row || !currentFood) return;
    const idx = Number(row.dataset.nutrientIdx);
    const nutrientName = detailNutrients[idx];
    if (nutrientName) openNutrientModal(currentFood, nutrientName);
  };
}

function openNutrientModal(food, nutrientName) {
  const meta = nutrientMetaByName(nutrientName);
  const aggregate = food.nutrients ? food.nutrients[nutrientName] : null;
  const stat = (food.nutrient_stats || {})[nutrientName];
  const sources = food.sources || [];

  const rows = sources.map(src => {
    const val = sourceNutrientValue(src, nutrientName);
    return { src, val };
  }).sort((a, b) => {
    const av = a.val == null ? -Infinity : a.val;
    const bv = b.val == null ? -Infinity : b.val;
    return bv - av;
  });

  const reporting = rows.filter(r => r.val != null).length;

  document.getElementById('modal-title').textContent = nutrientName;
  document.getElementById('modal-subtitle').textContent =
    `Aggregate: ${formatVal(aggregate)} ${meta.unit}` +
    (sources.length ? ` · ${reporting}/${sources.length} sources report this nutrient` : '');

  let body = `<table class="source-table"><thead><tr>
    <th>USDA food</th><th>Type</th><th>Match</th><th>Value</th>
  </tr></thead><tbody>`;

  if (!sources.length) {
    body += `<tr><td colspan="4">No USDA sources matched for this ingredient.</td></tr>`;
  }

  for (const { src, val } of rows) {
    const missing = val == null;
    body += `<tr class="${missing ? 'missing' : ''}">
      <td>${esc(src.foodName)}</td>
      <td>${esc(src.data_type || '—')}</td>
      <td>${src.similarity != null ? Math.round(src.similarity * 100) + '%' : '—'}</td>
      <td>${missing ? '—' : formatVal(val) + ' ' + esc(meta.unit)}</td>
    </tr>`;
  }

  body += `<tr class="aggregate">
    <td colspan="3">Aggregate (mean)</td>
    <td>${formatVal(aggregate)} ${esc(meta.unit)}</td>
  </tr>`;

  if (stat && stat.ci_low != null && stat.ci_high != null) {
    body += `<tr class="aggregate">
      <td colspan="3">95% confidence interval</td>
      <td>${formatVal(stat.ci_low)} – ${formatVal(stat.ci_high)} ${esc(meta.unit)}</td>
    </tr>`;
  }

  body += '</tbody></table>';
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('nutrient-modal').classList.add('visible');
  setModalOpen(true);
}

function closeNutrientModal() {
  document.getElementById('nutrient-modal').classList.remove('visible');
  if (!document.getElementById('coverage-modal').classList.contains('visible')) {
    setModalOpen(false);
  }
}

function openCoverageModal() {
  if (!dbCoverage || !dbCoverage.nutrients) return;
  const total = dbCoverage.ingredients_with_sources || 0;
  const summary = dbCoverage.summary || {};
  document.getElementById('coverage-subtitle').textContent =
    `${total.toLocaleString()} ingredients with USDA sources · ` +
    `${summary.well_measured || 0} nutrients ≥50% coverage · ` +
    `${summary.rarely_measured || 0} rarely measured`;

  const rows = [...dbCoverage.nutrients].sort((a, b) => b.coverage_pct - a.coverage_pct);
  let body = `<table class="coverage-table"><thead><tr>
    <th>Nutrient</th><th>Category</th><th>Coverage</th><th></th>
  </tr></thead><tbody>`;
  for (const row of rows) {
    const pct = Math.round(row.coverage_pct * 100);
    body += `<tr>
      <td>${esc(row.name)}</td>
      <td>${esc(row.category || '—')}</td>
      <td class="coverage-pct">${pct}% <span style="color:var(--muted)">(${row.ingredients_with_value}/${row.ingredients_total})</span></td>
      <td style="width:28%"><div class="coverage-bar" style="width:${pct}%"></div></td>
    </tr>`;
  }
  body += '</tbody></table>';
  document.getElementById('coverage-body').innerHTML = body;
  document.getElementById('coverage-modal').classList.add('visible');
  setModalOpen(true);
}

function closeCoverageModal() {
  document.getElementById('coverage-modal').classList.remove('visible');
  if (!document.getElementById('nutrient-modal').classList.contains('visible')) {
    setModalOpen(false);
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeNutrientModal();
    closeCoverageModal();
  }
});

function formatVal(v) {
  if (v == null || v === '') return '—';
  const num = Number(v);
  if (!Number.isFinite(num)) return '—';
  if (num >= 100) return Math.round(num).toLocaleString();
  if (num >= 1) return num.toFixed(1);
  return num.toFixed(2);
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Boot
init();
</script>
