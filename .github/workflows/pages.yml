name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare site
        run: |
          mkdir -p docs/data
          python -c "
          import json
          with open('pyfooda/data/foods_aggregated.json') as f:
              data = json.load(f)
          web = []
          for item in data:
              web.append({
                  'n': item['generic_name'],
                  'c': item['food_category'],
                  'v': item['nutrients'],
                  's': item['source_names'],
                  'ct': item['count'],
                  'pw': item.get('portion_gram_weight'),
                  'pu': item.get('portion_unit_name'),
              })
          with open('docs/data/foods.json', 'w') as f:
              json.dump(web, f, separators=(',', ':'))
          print(f'Generated foods.json: {len(web)} foods')
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
